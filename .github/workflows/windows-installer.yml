name: Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "installer/**"
      - "assets/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  installer:
    name: Build MP3Tagger-Setup.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw "version not found in Cargo.toml" }
          # NSIS needs a 4-field numeric version, so 0.1.0 becomes 0.1.0.0
          $nums = @()
          foreach ($part in ($version -split '\.')) {
            $n = 0
            if ([int]::TryParse($part, [ref]$n)) { $nums += $n } else { break }
          }
          while ($nums.Count -lt 3) { $nums += 0 }
          $numeric = "$($nums[0]).$($nums[1]).$($nums[2]).0"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "setup=MP3Tagger-Setup-$version.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "archive=MP3Tagger-$version-windows-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version numeric=$numeric"

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) {
            Write-Host "using preinstalled NSIS: $($makensis.Source)"
          } else {
            choco install nsis --no-progress -y
          }
          makensis /VERSION

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify the resources were embedded
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target\release\mp3-tagger.exe").Path
          # The version resource only exists if winresource compiled the .rc
          # into the binary, which is the same code path as the icon.
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductName -ne "MP3 Tagger") {
            throw "ProductName was not embedded, found '$($vi.ProductName)'"
          }
          if ($vi.FileVersion -notmatch "^${{ steps.meta.outputs.numeric }}\.") {
            throw "unexpected FileVersion '$($vi.FileVersion)'"
          }
          Write-Host "ProductName=$($vi.ProductName) FileVersion=$($vi.FileVersion)"

          # Sanity check the icon source and look for its pixels in the binary.
          $ico = [System.IO.File]::ReadAllBytes("assets\icon.ico")
          if ([BitConverter]::ToUInt16($ico, 2) -ne 1) { throw "icon.ico is not an icon file" }
          $count = [BitConverter]::ToUInt16($ico, 4)
          $found = $false
          for ($i = 0; $i -lt $count; $i++) {
            $rec = 6 + $i * 16
            $width = $ico[$rec]
            if ($width -eq 0) { $width = 256 }
            $size = [BitConverter]::ToUInt32($ico, $rec + 8)
            $offset = [BitConverter]::ToUInt32($ico, $rec + 12)
            if ($width -ne 256) { continue }
            $found = $true
            # Skip past the DIB header so a rewritten header field cannot
            # cause a false negative; sample raw pixel data instead.
            $start = $offset + 1024
            $needle = [System.Text.Encoding]::Latin1.GetString($ico, $start, 64)
            $haystack = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($exe))
            if (-not $haystack.Contains($needle)) {
              Write-Warning "sampled 256px icon pixels were not found verbatim in the executable"
            } else {
              Write-Host "256px icon payload present ($size bytes per .ico entry)"
            }
          }
          if (-not $found) { throw "icon.ico has no 256px entry" }

      - name: Compile NSIS installer
        shell: pwsh
        run: |
          makensis `
            -DAPP_VERSION=${{ steps.meta.outputs.version }} `
            -DAPP_VERSION_NUM=${{ steps.meta.outputs.numeric }} `
            -DOUTPUT_NAME=${{ steps.meta.outputs.setup }} `
            installer/mp3-tagger.nsi

      - name: Create portable zip
        shell: pwsh
        run: |
          $stage = "target\portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\mp3-tagger.exe" $stage
          Copy-Item "README.md" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "target\${{ steps.meta.outputs.archive }}"
          Write-Host "created target\${{ steps.meta.outputs.archive }}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            target/${{ steps.meta.outputs.setup }}
            target/${{ steps.meta.outputs.archive }}

      - name: Attach installers to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "MP3 Tagger $tag" --generate-notes
          }
          gh release upload $tag `
            "target/${{ steps.meta.outputs.setup }}" `
            "target/${{ steps.meta.outputs.archive }}" `
            --clobber
          Write-Host "attached installers to release $tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
