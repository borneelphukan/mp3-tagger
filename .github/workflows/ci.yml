name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev \
            libxcb-image0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      # Pinned so a new stable release cannot introduce lints that fail an
      # unrelated tag build. Bump deliberately in both workflows.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings are errors, so this is a hard gate. The two allowed lints are
        # pre-existing findings (src/services/metadata.rs, src/ui/state.rs);
        # remove the allows once they are fixed.
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A clippy::never_loop -A clippy::large_enum_variant

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked

  linux-assets:
    name: packaging assets are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop entry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/debian/mp3-tagger.desktop

      - name: Validate AppStream metadata
        run: |
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net packaging/debian/mp3-tagger.metainfo.xml

      - name: Shell script syntax
        run: |
          bash -n packaging/debian/build-deb.sh
          sh -n packaging/debian/postinst
          sh -n packaging/debian/prerm
          sh -n packaging/debian/postrm
          sh -n packaging/apt/install.sh
          python3 -m py_compile packaging/apt/build-repo.py
