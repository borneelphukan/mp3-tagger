[package]
name = "mp3-tagger"
version = "0.1.0"
edition = "2021"
description = "MP3 Metadata Editor with LLM-powered metadata fetching"
authors = ["borneelphukan <borneelphukan@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/borneelphukan/mp3-tagger"
homepage = "https://github.com/borneelphukan/mp3-tagger"
categories = ["multimedia::audio", "gui"]
keywords = ["mp3", "tagger", "metadata", "id3", "audio"]

[dependencies]
# eframe's default renderer is glow; the wgpu feature was enabled but never
# selected, so dropping it removes a large dependency tree from every build.
# `persistence` is kept because eframe uses it to remember window size/position.
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = "0.29"
lofty = "0.25"
# `rustls-tls` is an alias for `rustls-tls-webpki-roots`; only one is needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# "rc" lets AlbumArt serialize an Arc<[u8]> without copying the image data.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# Only the runtime and macro support that this app actually uses. reqwest
# enables the networking/time features it needs on its own.
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
directories = "5.0"
# Decode only the formats the app accepts. Without default-features=false this
# pulled in AVIF/EXR/TIFF/WebP decoders that were never reachable.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
thiserror = "1.0"

[profile.dev]
# Full debug information roughly triples the target directory and slows linking.
debug = 1

[profile.test]
debug = 1

[profile.release]
opt-level = 3
# Thin LTO links much faster than fat LTO while keeping most of the runtime
# benefit; codegen-units=1 keeps the final binary compact.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
# Build scripts and proc macros do not need optimized code; compiling them at
# opt-level 3 is pure build-time cost.
opt-level = 0
codegen-units = 256

[workspace]

[build-dependencies]
winresource = "0.1"
