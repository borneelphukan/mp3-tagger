[package]
name = "mp3-tagger"
version = "0.1.0"
edition = "2021"
description = "MP3 Metadata Editor with LLM-powered metadata fetching"
authors = ["borneelphukan <borneelphukan@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/borneelphukan/mp3-tagger"
homepage = "https://github.com/borneelphukan/mp3-tagger"
categories = ["multimedia::audio", "gui"]
keywords = ["mp3", "tagger", "metadata", "id3", "audio"]

[dependencies]
eframe = { version = "0.29", features = ["persistence", "wgpu"] }
egui = "0.29"
egui_extras = "0.29"
lofty = { version = "0.25", features = ["default"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
directories = "5.0"
image = { version = "0.25", features = ["png", "jpeg", "gif", "bmp"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = { version = "0.22", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]

[build-dependencies]
winresource = "0.1"
